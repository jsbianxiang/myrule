# =====================================================
# 中国大陆公共 DNS 域名清单
# - 收录常见中国大陆公共 DNS 服务的 DoH / DoT / 传统解析域名
# - 适合作为「直连上游 DNS」的域名规则使用
#
# 服务概览：
# - DNSPod Public DNS+：腾讯旗下公共 DNS，支持 IPv4 / IPv6 及 DoH / DoT。
# - AliDNS（阿里云 DNS）：稳定高可用，适用于国内常规解析与 IPv6 场景。
# - 360 DNS：奇虎 360 推出，支持传统与加密 DNS（DoH / DoT）。
# - 18bit DNS：新兴公共 DNS，主打广告拦截与加密访问。
# - 关胜 DNS：以拦截广告和恶意内容为主，支持加密协议。
# =====================================================
payload:
  # -- DNSPod Public DNS+ --
  # 公共解析 + DoH / DoT 等多协议访问入口
  - DOMAIN,doh.pub
  - DOMAIN,dot.pub
  - DOMAIN,dns.pub

  # -- AliDNS（阿里云公共 DNS）--
  # 面向国内用户的高性能公共 DNS 解析
  - DOMAIN,dns.alidns.com

  # -- 360 DNS --
  # 提供传统解析与 DoH / DoT 加密访问
  - DOMAIN,doh.360.cn
  - DOMAIN,dot.360.cn

  # -- 18bit DNS（广告拦截）--
  # 以拦截广告为主的加密 DNS（DoH / DoT）服务入口
  - DOMAIN,doh.18bit.cn

  # -- 关胜 DNS（广告拦截）--
  # 聚焦广告 / 恶意内容拦截的加密 DNS 服务
  - DOMAIN,2026.dns1.top
