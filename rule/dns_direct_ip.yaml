# =====================================================
# 中国大陆公共 DNS 直连 IP 清单
# 收录常见中国大陆公共 DNS 服务商的直连 IP
# 所有 IP 规则均已附加 `no-resolve`，避免反查并提升匹配性能
#
# 服务概览：
# 114 DNS：覆盖广、线路多，提供普通 / 净化 / 家庭等多种过滤级别。
# DNSPod Public DNS+：腾讯旗下公共 DNS，支持 IPv4 / IPv6 及 DoH / DoT。
# AliDNS（阿里云 DNS）：稳定高可用，原生支持 IPv6。
# 百度 DNS：百度提供的公共解析服务。
# 360 DNS：奇虎 360 推出，兼容传统与加密 DNS（DoH/DoT）。
# CNNIC DNS：由中国互联网络信息中心运营的权威公共 DNS。
# =====================================================
payload:
    # -114 DNS --
    # 普通线路
    - 114.114.114.114/32
    - 114.114.115.115/32
    # 净化版（拦截恶意/广告）
    - 114.114.114.119/32
    - 114.114.115.119/32
    # 家庭版（青少年保护）
    - 114.114.114.110/32
    - 114.114.115.110/32

    # DNSPod Public DNS+
    - 119.29.29.29/32
    - 119.28.28.28/32
    - 2402:4e00::/128
    - 2402:4e00:1::/128
    - 1.12.12.12/32
    - 120.53.53.53/32

    # AliDNS（阿里云公共DNS）
    - 223.5.5.5/32
    - 223.6.6.6/32
    - 2400:3200::1/128
    - 2400:3200:baba::1/128

    # 百度DNS
    - 180.76.76.76/32

    # 360 DNS
    - 101.226.4.6/32
    - 218.30.118.6/32
    - 123.125.81.6/32
    - 140.207.198.6/32
    - 36.99.170.86/32
    - 106.63.24.74/32
