# =====================================================
# 国际主流DNS服务器规则清单
# - 提供常用国际DNS的节点及其说明
# - 所有IP规则均使用no-resolve，提升性能并避免DNS反查
#
# 各主要DNS服务简介：
# * Google DNS：速度快、全球可用、支持DoH/DoT，适合一般及开发使用
# * Cloudflare DNS：主打隐私与安全，支持多种加密及分级过滤（标准、FamilyShield、成人/恶意内容拦截）
# * Quad9 DNS：专注安全防护，默认阻断恶意域名，亦有未加过滤与ECS版本
# * OpenDNS：拥有钓鱼及内容过滤，分标准、FamilyShield与Sandbox三种模式
# * DNS.SB、AdGuard、NextDNS、CONTROLD等提供补充及多维过滤模式
# 亚洲区便捷节点附于底部，可根据实际需求自行增删
# =====================================================
payload:
  # ==== 国际DNS ====
  # -- Google DNS --
  - DOMAIN,dns.google
  - IP-CIDR,8.8.8.8/32,no-resolve
  - IP-CIDR,8.8.4.4/32,no-resolve
  - IP-CIDR6,2001:4860:4860::8888/128,no-resolve
  - IP-CIDR6,2001:4860:4860::8844/128,no-resolve

  # -- Cloudflare DNS --
  - DOMAIN,cloudflare-dns.com
  - DOMAIN,dns.cloudflare.com
  - DOMAIN,one.one.one.one
    # 标准模式
  - IP-CIDR,1.1.1.1/32,no-resolve
  - IP-CIDR,1.0.0.1/32,no-resolve
  - IP-CIDR6,2606:4700:4700::1111/128,no-resolve
  - IP-CIDR6,2606:4700:4700::1001/128,no-resolve
    # FamilyShield家庭过滤
  - IP-CIDR,1.1.1.2/32,no-resolve
  - IP-CIDR,1.0.0.2/32,no-resolve
  - IP-CIDR6,2606:4700:4700::1112/128,no-resolve
  - IP-CIDR6,2606:4700:4700::1002/128,no-resolve
    # 恶意及成人内容拦截
  - IP-CIDR,1.1.1.3/32,no-resolve
  - IP-CIDR,1.0.0.3/32,no-resolve
  - IP-CIDR6,2606:4700:4700::1113/128,no-resolve
  - IP-CIDR6,2606:4700:4700::1003/128,no-resolve

  # -- Quad9 DNS --
  # 标准安全防护
  - DOMAIN,dns.quad9.net
  - IP-CIDR,9.9.9.9/32,no-resolve
  - IP-CIDR,149.112.112.112/32,no-resolve
  - IP-CIDR6,2620:fe::fe/128,no-resolve
  - IP-CIDR6,2620:fe::9/128,no-resolve
    # 非过滤(无安全拦截)
  - DOMAIN,dns10.quad9.net
  - IP-CIDR,9.9.9.10/32,no-resolve
  - IP-CIDR,149.112.112.10/32,no-resolve
  - IP-CIDR6,2620:fe::10/128,no-resolve
  - IP-CIDR6,2620:fe::fe:10/128,no-resolve
    # ECS支持（更优定位）
  - DOMAIN,dns11.quad9.net
  - IP-CIDR,9.9.9.11/32,no-resolve
  - IP-CIDR,149.112.112.11/32,no-resolve
  - IP-CIDR6,2620:fe::11/128,no-resolve
  - IP-CIDR6,2620:fe::fe:11/128,no-resolve

  # -- OpenDNS --
  # 标准模式
  - DOMAIN,doh.opendns.com
  - DOMAIN,dns.opendns.com
  - DOMAIN,doh.umbrella.com
  - DOMAIN,dns.umbrella.com
  - DOMAIN,dns.sse.cisco.com
  - IP-CIDR,208.67.222.222/32,no-resolve
  - IP-CIDR,208.67.220.220/32,no-resolve
  - IP-CIDR6,2620:119:35::35/128,no-resolve
  - IP-CIDR6,2620:119:53::53/128,no-resolve
