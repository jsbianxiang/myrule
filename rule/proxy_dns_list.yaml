  - IP-CIDR,94.140.14.140/32,no-resolve
  - IP-CIDR,94.140.14.141/32,no-resolve
  - IP-CIDR6,2a10:50c0::1:ff/128,no-resolve
  - IP-CIDR6,2a10:50c0::2:ff/128,no-resolve

