payload:
    # ==== 国际常用公共 DNS ====
    # -Google Public DNS --
    - dns.google

    # -Cloudflare DNS --
    - cloudflare-dns.com
    - dns.cloudflare.com
    - one.one.one.one

    # -Quad9（安全防护 DNS）--
    # 标准安全过滤（默认拦截已知恶意域名）
    - dns.quad9.net
    # 无过滤版本（不做安全拦截）
    - dns10.quad9.net
    # 启用 ECS（更优地理定位）
    - dns11.quad9.net

    # -OpenDNS / Cisco Umbrella --
    # 标准模式
    - doh.opendns.com
    - dns.opendns.com
    - doh.umbrella.com
    - dns.umbrella.com
    - dns.sse.cisco.com
    # FamilyShield 家庭防护（默认拦截成人内容等）
    - doh.familyshield.opendns.com
    - familyshield.opendns.com
    # Sandbox 测试 / 隔离环境
    - doh.sandbox.opendns.com
    - sandbox.opendns.com

    # -DNS.SB --
    - doh.dns.sb
    - doh.sb
    - dns.sb
    - dot.sb

    # -AdGuard DNS --
    # 默认拦截广告与跟踪
    - dns.adguard-dns.com
    # Family Protection 家庭保护节点
    - family.adguard-dns.com
    # 无过滤模式（仅提供解析）
    - unfiltered.adguard-dns.com

    # -NextDNS --
    - dns.nextdns.io
    - anycast.dns.nextdns.io

    # -ControlD DNS --
    # 使用后缀匹配，适配不同策略前缀
    - +.freedns.controld.com

    # === 亚洲区域公共 DNS ===
    # 台湾 TWNIC Quad 101
    - dns.twnic.tw

    # 日本 IIJ 公共 DNS
    - public.dns.iij.jp

    # 日本 Japan DNS Server
    - jp.tiarap.org
    - jp.tiar.app
