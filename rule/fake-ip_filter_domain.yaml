payload:
  # ──────────────────────────────────────────────────────────────
  # Windows 网络连接检测域名（Win10/11 NCSI 测试）
  # 如果这些域名走 Fake-IP，会导致系统误判“无网络连接”，图标显示感叹号
  # ──────────────────────────────────────────────────────────────
  - "+.msftconnecttest.com" # Microsoft NCSI 连接测试主域名（Win10/11 网络状态检测）
  - "+.msftncsi.com" # 旧版/备用 NCSI 域名（Windows 网络连接检测备用）

  # ──────────────────────────────────────────────────────────────
  # QQ 登录本地回环检测（PC 版 QQ 登录时会检测 localhost）
  # 如果走 Fake-IP，会导致 QQ 登录失败或卡在“检测网络”界面
  # ──────────────────────────────────────────────────────────────
  - localhost.ptlogin2.qq.com # QQ PC 版登录回环检测域名
  - localhost.sec.qq.com # QQ 安全登录回环检测域名

  # ──────────────────────────────────────────────────────────────
  # 微信登录本地回环检测（微信 PC 版登录时会检测 localhost）
  # 通配符匹配所有子域，防止登录失败
  # ──────────────────────────────────────────────────────────────
  - "localhost.*.weixin.qq.com" # 微信 PC 版登录回环检测域名（通配所有子域）

  # ──────────────────────────────────────────────────────────────
  # STUN 服务器域名（WebRTC、游戏、视频通话常用）
  # 如果走 Fake-IP，会导致 WebRTC 连接失败、游戏语音卡顿、视频会议黑屏
  # 通配多级子域，覆盖绝大部分 stun 服务器
  # ──────────────────────────────────────────────────────────────
  - "+.stun.*.*" # 两级子域 stun（如 stun.l.google.com）
  - "+.stun.*.*.*" # 三级子域 stun
  - "+.stun.*.*.*.*" # 四级子域 stun
  - "+.stun.*.*.*.*.*" # 五级子域 stun（覆盖绝大部分公共 STUN）

  # ──────────────────────────────────────────────────────────────
  # 自定义添加（你的特殊需求域名）
  # ──────────────────────────────────────────────────────────────
  - "+.xn--zoom.com" # zoom.com 的 punycode 形式（防域名污染或变种）
  - "+.xn--zoomm.com" # zoomm.com 的 punycode 形式（防变种）
