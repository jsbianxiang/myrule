    # ──────────────────────────────────────────────────────────────
    # 1. 即时通讯：回环检测白名单 (QQ / 微信 PC 版)
    # 逻辑：客户端启动时通过特定域名探测 localhost 接口以完成内部协议握手。
    # 影响：若流量被 Fake-IP 劫持，将导致客户端无法识别本地服务，引发登录卡顿或“网络环境异常”提示。
    # ──────────────────────────────────────────────────────────────
    - "localhost.*.qq.com" # QQ PC 版登录进程回环探测
    - "localhost.*.weixin.qq.com" # 微信 PC 版登录进程回环探测

    # ──────────────────────────────────────────────────────────────
    # 2. 网络穿透：STUN 基础设施 (P2P / 游戏语音 / 视频会议)
    # 逻辑：用于探测 NAT 类型并建立 WebRTC 等多媒体点对点连接。
    # 影响：Fake-IP 的拦截与解析延迟会导致穿透失败、语音掉线或视频会议黑屏。
    # 通配策略：通过多级子域覆盖，确保全球公共 STUN 服务器的响应链路直连。
    # ──────────────────────────────────────────────────────────────
    - "+.stun.*.*" # 标准二级 (如 stun.l.google.com)
    - "+.stun.*.*.*" # 标准三级
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*" # 复杂多级子域覆盖

    # ──────────────────────────────────────────────────────────────
    # 3. 系统核心：微软网络连通性测试 (NCSI / 联网状态检测)
    # 逻辑：Windows 通过探测特定域名验证互联网接入状态。
    # 影响：若命中 Fake-IP，系统可能误判为“无网络访问”，导致任务栏显示网络异常图标，
    #       并可能阻断 Outlook、Office 等 UWP 应用的在线同步功能。
    # ──────────────────────────────────────────────────────────────
    - "+.msftconnecttest.com" # Windows 10/11 核心连通性探测
    - "+.msftncsi.com" # 兼容性/旧版 NCSI 探测域名

    # ──────────────────────────────────────────────────────────────
    # 4. 用户自定义：直连域名白名单
    # ──────────────────────────────────────────────────────────────
    - +.commentsmodule.com # 自定义绕过代理的域名
