    # ──────────────────────────────────────────────────────────────
    # 代理加速域名列表 (Proxy Domains)
    # ──────────────────────────────────────────────────────────────

    # 1. 游戏社区与交互 (Gaming & Social)
    # 逻辑：Steam 社区及其 API 分发通常受到干扰，需走代理保障库存和个人资料加载。
    - steamcommunity.com # Steam 社区主域名

    # 3. 数据分析与网络工具 (Analytics & Web Tools)
    - statscrop.com # 网站价值评估与统计分析工具

    # 4. 影音娱乐与自定义 (Entertainment & Leisure)
    # 逻辑：此类域名涉及内容管控或海外独占资源，需通过代理访问。
    - +.91cg.com
    - +.51-cg.com
    - +.xxgasm.com
    - +.cumception.com

    # ──────────────────────────────────────────────────────────────
    # 5. 用户自定义：代理白名单
    # ──────────────────────────────────────────────────────────────
    # - +.example.com # 您可以仿照上述格式在此添加新的代理域名
    # - +.xn--zoom.com
    # - +.xn--zoomm.com
