# =====================================================
# 公共 DNS 代理直连 IP 清单
# 收录常见国际 / 部分亚洲公共 DNS 的 IP 节点
# 全部规则已附加 `no-resolve`，避免反向解析开销并提升匹配性能
#
# 服务概览（按品牌分组）：
# Google Public DNS：全球通用，稳定可靠，适合通用及开发场景。
# Cloudflare 1.1.1.1：主打隐私与安全，提供标准 / 家庭 / 恶意内容拦截等多种策略。
# Quad9：专注恶意域名拦截，并提供无过滤与支持 ECS 的版本。
# OpenDNS / Cisco Umbrella：内置钓鱼和内容过滤，支持 FamilyShield 与 Sandbox 模式。
# DNS.SB、AdGuard、NextDNS、ControlD：提供多档过滤策略及加密访问，适合细粒度策略管理。
#
# 底部附带少量亚洲区域（台湾 / 日本）公共 DNS IP，可按需要增删或拓展自建节点。
# =====================================================
payload:
    # ==== 国际公共 DNS ====
    # -Google Public DNS --
    - 8.8.8.8/32
    - 8.8.4.4/32
    - 2001:4860:4860::8888/128
    - 2001:4860:4860::8844/128

    # Cloudflare DNS
    # 标准模式（1.1.1.1）
    - 1.1.1.1/32
    - 1.0.0.1/32
    - 2606:4700:4700::1111/128
    - 2606:4700:4700::1001/128
    # Family（家庭过滤）
    - 1.1.1.2/32
    - 1.0.0.2/32
    - 2606:4700:4700::1112/128
    - 2606:4700:4700::1002/128
    # 恶意软件 + 成人内容拦截
    - 1.1.1.3/32
    - 1.0.0.3/32
    - 2606:4700:4700::1113/128
    - 2606:4700:4700::1003/128

    # Quad9 DNS
    # 标准安全过滤（默认拦截恶意域名）
    - 9.9.9.9/32
    - 149.112.112.112/32
    - 2620:fe::fe/128
    - 2620:fe::9/128
    # 无过滤（不做安全拦截）
    - 9.9.9.10/32
    - 149.112.112.10/32
    - 2620:fe::10/128
    - 2620:fe::fe:10/128
    # 启用 ECS（更优地理定位）
    - 9.9.9.11/32
    - 149.112.112.11/32
    - 2620:fe::11/128
    - 2620:fe::fe:11/128

    # OpenDNS / Cisco Umbrella
    # 标准公共 DNS
    - 208.67.222.222/32
    - 208.67.220.220/32
    - 2620:119:35::35/128
    - 2620:119:53::53/128
    # FamilyShield 家庭防护
    - 208.67.222.123/32
    - 208.67.220.123/32
    # Sandbox 测试 / 隔离环境
    - 208.67.222.2/32
    - 208.67.220.2/32
    - 2620:0:ccc::2/128
    - 2620:0:ccd::2/128

    # DNS.SB
    - 185.222.222.222/32
    - 45.11.45.11/32
    - 2a09::/128
    - 2a11::/128

    # AdGuard DNS
    # 默认过滤：拦截广告与跟踪
    - 94.140.14.14/32
    - 94.140.15.15/32
    - 2a10:50c0::ad1:ff/128
    - 2a10:50c0::ad2:ff/128
    # Family Protection：家庭保护节点
    - 94.140.14.15/32
    - 94.140.15.16/32
    - 2a10:50c0::bad1:ff/128
    - 2a10:50c0::bad2:ff/128
    # Unfiltered：无过滤模式
    - 94.140.14.140/32
    - 94.140.14.141/32
    - 2a10:50c0::1:ff/128
    - 2a10:50c0::2:ff/128

    # NextDNS
    - 45.90.28.94/32
    - 45.90.30.94/32
    - 2a07:a8c0::42:5a9c/128
    - 2a07:a8c1::42:5a9c/128

    # ControlD DNS
    # P0：无拦截（纯解析）
    - 76.76.2.0/32
    - 76.76.10.0/32
    - 2606:1a40::/128
    - 2606:1a40:1::/128
    # P1：恶意软件防护
    - 76.76.2.1/32
    - 76.76.10.1/32
    - 2606:1a40::1/128
    - 2606:1a40:1::1/128
    # P2：广告与追踪拦截
    - 76.76.2.2/32
    - 76.76.10.2/32
    - 2606:1a40::2/128
    - 2606:1a40:1::2/128
    # P3：社交媒体拦截
    - 76.76.2.3/32
    - 76.76.10.3/32
    - 2606:1a40::3/128
    - 2606:1a40:1::3/128
    # P4：家庭友好过滤
    - 76.76.2.4/32
    - 76.76.10.4/32
    - 2606:1a40::4/128
    - 2606:1a40:1::4/128
    # P5：高级自定义策略
    - 76.76.2.5/32
    - 76.76.10.5/32
    - 2606:1a40::5/128
    - 2606:1a40:1::5/128

    # 亚洲区域公共 DNS IP

    # 台湾 Quad 101
    - 101.101.101.101/32
    - 101.102.103.104/32
    - 2001:de4::101/128
    - 2001:de4::102/128

    # 日本 Japan DNS Server
    - 172.104.93.80/32
    - 2400:8902::f03c:91ff:feda:c514/128
