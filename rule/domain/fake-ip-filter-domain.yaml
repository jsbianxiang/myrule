  # --------------------------------------------------------------
  # 用户自定义：fake-ip-filter 域名白名单
  #
  # 命中后返回真实 IP，不使用 Fake-IP。
  # 是否经过代理由后续 Rules 决定。
  #
  # 注意：
  #   "*" 仅匹配一级域名，不递归匹配多级域名。
  #   对需要覆盖多级域名的服务，必须逐级声明。
  # --------------------------------------------------------------

  # --------------------------------------------------------------
  # STUN / NAT 穿透 / WebRTC
  #
  # STUN 用于：
  #   - NAT 类型检测
  #   - UDP 打洞
  #   - P2P 建链
  #   - WebRTC
  #
  # 注意：
  #   "*" 仅匹配一级域名。
  #   因此必须按域名层级连续覆盖。
  #
  # 例如：
  #   stun.example.com
  #       → +.stun.*
  #
  #   stun.services.mozilla.com
  #       → +.stun.*.*
  # --------------------------------------------------------------
  - "+.stun.*"
  - "+.stun.*.*"
  - "+.stun.*.*.*"
  - "+.stun.*.*.*.*"
  - "+.stun.*.*.*.*.*"

  # --------------------------------------------------------------
  # TURN / TURN over TLS
  #
  # 用于 NAT 穿透失败后的中继及实时通信。
  #
  # "*" 仅匹配一级域名，因此按层级连续覆盖。
  # --------------------------------------------------------------
  - "+.turn.*"
  - "+.turn.*.*"
  - "+.turn.*.*.*"
  - "+.turn.*.*.*.*"
  - "+.turn.*.*.*.*.*"
  - "+.turns.*"
  - "+.turns.*.*"
  - "+.turns.*.*.*"
  - "+.turns.*.*.*.*"
  - "+.turns.*.*.*.*.*"

  # --------------------------------------------------------------
  # 系统网络连通性检测
  #
  # 用于操作系统判断：
  #   - 当前网络是否正常
  #   - 是否存在 Captive Portal
  #   - 是否能够访问公网
  #
  # 返回 Real-IP，避免 Fake-IP 干扰系统网络状态判断。
  # --------------------------------------------------------------

  # Microsoft
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
