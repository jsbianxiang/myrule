# =====================================================
# 中国大陆主流DNS服务器规则表
# - 收录常见中国大陆DNS服务商及直连专用域名
# - 所有IP规则均加入no-resolve提升性能避免DNS反查
#
# DNS服务简介：
# * 114 DNS：国内广泛应用，区分普通、家庭、净化版等多类型
# * DNSPod Public DNS+：腾讯旗下，支持多种解析协议（IPv4/IPv6、DoH/DoT）
# * AliDNS：阿里云DNS，稳定可靠，具备IPv6支持
# * 百度DNS：百度提供的公共DNS服务
# * 360 DNS：奇虎360推出的公共DNS及DoH、DoT服务
# * CNNIC DNS：国家互联网信息中心权威DNS
# * 18bit DNS：新兴公共DNS，支持加密
# =====================================================
payload:
  # -- 114 DNS --
  # 普通线路
  - IP-CIDR,114.114.114.114/32,no-resolve
  - IP-CIDR,114.114.115.115/32,no-resolve
  # 净化版（安全过滤）
  - IP-CIDR,114.114.114.119/32,no-resolve
  - IP-CIDR,114.114.115.119/32,no-resolve
  # 家庭版（青少年过滤）
  - IP-CIDR,114.114.114.110/32,no-resolve
  - IP-CIDR,114.114.115.110/32,no-resolve

  # -- DNSPod Public DNS+ --
  # 多协议支持：IPv4、IPv6及加密DNS（DoH/DoT）
  - DOMAIN,doh.pub
  - DOMAIN,dot.pub
  - DOMAIN,dns.pub
  - IP-CIDR,119.29.29.29/32,no-resolve
  - IP-CIDR,119.28.28.28/32,no-resolve
  - IP-CIDR6,2402:4e00::/128,no-resolve
  - IP-CIDR6,2402:4e00:1::/128,no-resolve
  - IP-CIDR,1.12.12.12/32,no-resolve
  - IP-CIDR,120.53.53.53/32,no-resolve

  # -- AliDNS (阿里云) --
  # 高性能国内公共DNS，支持IPv6
  - DOMAIN,dns.alidns.com
  - IP-CIDR,223.5.5.5/32,no-resolve
  - IP-CIDR,223.6.6.6/32,no-resolve
  - IP-CIDR6,2400:3200::1/128,no-resolve
  - IP-CIDR6,2400:3200:baba::1/128,no-resolve

  # -- 百度DNS --
  - IP-CIDR,180.76.76.76/32,no-resolve

  # -- 360 DNS --
  # 支持DoH/DoT及传统模式
  - DOMAIN,doh.360.cn
  - DOMAIN,dot.360.cn
  - IP-CIDR,101.226.4.6/32,no-resolve
  - IP-CIDR,218.30.118.6/32,no-resolve
  - IP-CIDR,123.125.81.6/32,no-resolve
  - IP-CIDR,140.207.198.6/32,no-resolve
  - IP-CIDR,36.99.170.86/32,no-resolve
  - IP-CIDR,106.63.24.74/32,no-resolve
  - IP-CIDR,101.91.111.153/32,no-resolve

  # -- CNNIC 国家互联网信息中心DNS --
  - IP-CIDR,1.2.4.8/32,no-resolve
  - IP-CIDR,210.2.4.8/32,no-resolve

  # -- 18bit DNS --
  # 支持DoH加密协议
  - DOMAIN,doh.18bit.cn
